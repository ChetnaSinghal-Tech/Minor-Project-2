<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Requests | Donix Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../assets/main.css">

</head>

<body class="admin-body">

<div class="admin-wrapper">

<aside class="admin-sidebar">

<div class="logo">🩸 Donix Admin</div>

<nav class="admin-nav">

<a href="admin.html">
<i class="fa-solid fa-chart-line"></i> Dashboard
</a>

<a href="../public/search.html">
<i class="fa-solid fa-users"></i> Donor Database
</a>

<a href="requests.html" class="active">
<i class="fa-solid fa-truck-medical"></i> Requests
</a>

<a href="#" class="logout logout-trigger">
<i class="fa-solid fa-right-from-bracket"></i> Logout
</a>

</nav>

</aside>

<main class="admin-content">

<header class="admin-header">

<h1>All Emergency Requests</h1>

<div class="system-time">Live Monitoring</div>

</header>


<div class="glass-card table-wrapper">

<h3>Emergency Request List</h3>

<table class="admin-table">

<thead>

<tr>

<th>Patient</th>
<th>Blood Type</th>
<th>Location</th>
<th>Urgency</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td>Rahul Sharma</td>

<td><span class="badge">A+</span></td>

<td>Metro Hospital</td>

<td><span class="status-pulse-small"></span> Critical</td>

<td><button class="btn-text remove-btn">Resolve</button></td>

</tr>


<tr>

<td>Neha Gupta</td>

<td><span class="badge">O-</span></td>

<td>City Hospital</td>

<td><span class="status-pulse-small"></span> Urgent</td>

<td><button class="btn-text remove-btn">Resolve</button></td>

</tr>


<tr>

<td>Arjun Mehta</td>

<td><span class="badge">B+</span></td>

<td>Care Medical Center</td>

<td><span class="status-pulse-small"></span> Critical</td>

<td><button class="btn-text remove-btn">Resolve</button></td>

</tr>

</tbody>

</table>

</div>

</main>

</div>

<script src="../js/auth.js"></script>
